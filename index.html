<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mfilm HR</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#13355b">
<link rel="icon" type="image/png" href="mf-hr-icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #f6f6f7; --fg: #1f2329; --mut: #6b7280; --brand: #0f8c8d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #e8e9eb; --mut: #9aa0a8; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #ld { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
  .sp { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(127, 127, 127, .25); border-top-color: var(--brand); margin: 0 auto 14px; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  p { color: var(--mut); margin: 0 0 14px; }
  button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--brand); color: #fff; }
</style>
</head>
<body>
<div id="ld"><div><img src="mf-hr-icon-192.png" alt="" width="72" height="72" style="border-radius:16px;display:block;margin:0 auto 16px"><div class="sp"></div><p>Opening Mfilm HR…</p></div></div>
<script>
/* Mfilm HR loader. This file never needs to change again:
   it fetches the latest app from your Google Apps Script and keeps a copy on the phone for fast start. */
var API_URL = 'https://script.google.com/macros/s/AKfycbyMrkUQz4uPv7ewAzj-k3NNyRInBLujlujwWPTYbuMOXzz3HPFdMtqAiGpEqORxYrwYlQ/exec';
var KEY = 'mf_ui';
function show(html) {
  html = html.replace("const CONFIG = { API_URL: '' };", 'const CONFIG = { API_URL: ' + JSON.stringify(API_URL) + ' };')
    .replace('<base target="_top">', '<base target="_top"><link rel="manifest" href="manifest.webmanifest">');
  document.open(); document.write(html); document.close();
}
function fetchUi() {
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'ui' }) })
    .then(function (r) { return r.json(); })
    .then(function (r) { if (!r.ok || !r.data || !r.data.html) throw new Error(r.error || 'No app'); return r.data; });
}
function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { } }
var cached = null;
try { cached = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { }
if (cached && cached.html) {
  // open the saved copy once this page has finished loading, so nothing of this page is left behind
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { show(cached.html); }); else show(cached.html);
  fetchUi().then(function (d) {
    if (d.version !== cached.version) { save(d); try { window.dispatchEvent(new CustomEvent('mf-update', { detail: d.version })); } catch (e) { } }
  }).catch(function () { });
} else {
  fetchUi().then(function (d) { save(d); show(d.html); }).catch(function () {
    document.getElementById('ld').innerHTML = '<div><p>Could not reach the Mfilm HR server.<br>Check your internet, then try again.</p><button onclick="location.reload()">Try again</button></div>';
  });
}
</script>
</body>
</html>
