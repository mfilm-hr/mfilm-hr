<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mfilm HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: fixed sidebar + top bar on desktop, app bar + bottom tabs on phones. */
:root{
  --bg:#f6f6f7; --surface:#ffffff; --surface2:#fafafa; --line:#e6e6e9; --line2:#efeff1;
  --text:#101114; --text2:#4b4f58; --muted:#868a93;
  --brand:#c8102e; --brand-ink:#ffffff; --brand-soft:#fcecee; --brand-line:#f4c9cf;
  --ok:#0f7b55; --ok-soft:#e6f4ee; --warn:#a55a00; --warn-soft:#fdf3e2; --bad:#c62828; --bad-soft:#fdecec; --info:#2459c7; --info-soft:#e9effc;
  --sk1:#eeeef0; --sk2:#f7f7f8;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(16,17,20,.04); --sh-2:0 1px 2px rgba(16,17,20,.04),0 8px 24px rgba(16,17,20,.06); --sh-3:0 12px 48px rgba(16,17,20,.18);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:248px; --top:60px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c0d0f; --surface:#141518; --surface2:#17181b; --line:#25272c; --line2:#1e2024;
  --text:#ececee; --text2:#b4b7be; --muted:#7f838c;
  --brand:#f0465f; --brand-ink:#ffffff; --brand-soft:#2a1418; --brand-line:#5a2029;
  --ok:#3ccf91; --ok-soft:#10261d; --warn:#f2b44c; --warn-soft:#2a2111; --bad:#ff6b6b; --bad-soft:#2c1517; --info:#7aa5ff; --info-soft:#141d33;
  --sk1:#1b1c20; --sk2:#22242a; --sh-1:none; --sh-2:0 1px 0 rgba(255,255,255,.02); --sh-3:0 16px 60px rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0c0d0f; --surface:#141518; --surface2:#17181b; --line:#25272c; --line2:#1e2024;
  --text:#ececee; --text2:#b4b7be; --muted:#7f838c;
  --brand:#f0465f; --brand-ink:#ffffff; --brand-soft:#2a1418; --brand-line:#5a2029;
  --ok:#3ccf91; --ok-soft:#10261d; --warn:#f2b44c; --warn-soft:#2a2111; --bad:#ff6b6b; --bad-soft:#2c1517; --info:#7aa5ff; --info-soft:#141d33;
  --sk1:#1b1c20; --sk2:#22242a; --sh-1:none; --sh-2:0 1px 0 rgba(255,255,255,.02); --sh-3:0 16px 60px rgba(0,0,0,.6); color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info);text-decoration:none} a:hover{text-decoration:underline}
.hidden{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:10px;height:var(--top);padding:0 18px;font-weight:700;font-size:15px;letter-spacing:-.1px;border-bottom:1px solid var(--line2)}
.mark{width:28px;height:28px;border-radius:8px;background:var(--text);position:relative;overflow:hidden;flex:none}
.mark:before{content:"";position:absolute;inset:0 0 auto 0;height:9px;background:repeating-linear-gradient(-45deg,var(--surface) 0 4px,var(--text) 4px 8px)}
.mark:after{content:"";position:absolute;left:6px;right:6px;bottom:6px;height:3px;border-radius:2px;background:var(--brand)}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
.nav{flex:1;overflow:auto;padding:10px 10px 16px}
.nav .grp{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:16px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text2);font-weight:500;text-align:left;position:relative}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.me{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line2);cursor:pointer}
.me:hover{background:var(--surface2)}
.me .nm{font-weight:600;font-size:13px;line-height:1.2}
.me .rl{font-size:12px;color:var(--muted)}
.topbar{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--muted);cursor:pointer;min-width:220px}
.searchbtn kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
.iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--text2)}
.iconbtn:hover{color:var(--text);border-color:var(--muted)}
.iconbtn .pip{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.main{margin-left:var(--side);min-height:100vh}
.page{max-width:1240px;margin:0 auto;padding:20px 28px 64px;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.appbar,.tabbar{display:none}
@media (max-width:900px){
  .side,.topbar .searchbtn{display:none}
  .main{margin-left:0}
  .topbar{padding:0 14px;padding-top:env(safe-area-inset-top);height:calc(var(--top) + env(safe-area-inset-top))}
  .topbar .mark{display:block}
  .page{padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:500;padding:6px 0;border-radius:10px;cursor:pointer;position:relative}
  .tabbar button.on{color:var(--brand);font-weight:600}
  .tabbar svg.i{width:22px;height:22px}
  .tabbar .cnt{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
}
@media (min-width:901px){ .topbar .mark{display:none} }

/* ---------- primitives ---------- */
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))} .g-3{grid-template-columns:repeat(3,minmax(0,1fr))} .g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1100px){ .g-4{grid-template-columns:repeat(2,minmax(0,1fr))} .g-3{grid-template-columns:repeat(2,minmax(0,1fr))} .g-main{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){ .g-2,.g-3{grid-template-columns:minmax(0,1fr)} }
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.card-h h2{margin:0;font-size:14px;font-weight:600;flex:1}
.card-b{padding:16px 18px}
.card-b.tight{padding:6px 18px}
.muted{color:var(--muted)} .t2{color:var(--text2)} .sm{font-size:12.5px} .xs{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.right{text-align:right}
h2.sec{font-size:13px;font-weight:600;color:var(--text2);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.6px}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.pagehead .t{flex:1;min-width:200px}
.pagehead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.4px}
.pagehead p{margin:4px 0 0;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.dark{background:var(--text);border-color:var(--text);color:var(--surface)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.lg{height:48px;padding:0 20px;font-size:15px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.busy{color:transparent!important;position:relative;pointer-events:none}
.btn.busy:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--text2);border:1px solid var(--line);white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.plain:before{display:none}
.p-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent} .p-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.p-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent} .p-info{background:var(--info-soft);color:var(--info);border-color:transparent}
.p-brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}

.av{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-weight:600;font-size:12.5px;color:#fff;flex:none;letter-spacing:.2px}
.av.lg{width:56px;height:56px;font-size:19px}
.av.sm{width:28px;height:28px;font-size:11px}

.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.6px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.bar.ok>i{background:var(--ok)}

.list>.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.list>.it:last-child{border-bottom:0}
.list .it.click{cursor:pointer;margin:0 -18px;padding:11px 18px}
.list .it.click:hover{background:var(--surface2)}
.it .t1{font-weight:600;line-height:1.3}
.it .t2s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 16px;color:var(--muted);text-align:center}
.empty svg.i{width:28px;height:28px;color:var(--muted);opacity:.7}

.tbl{overflow:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.2px}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
table.t tbody tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface2)}
table.t .n{text-align:right;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:700;background:var(--surface2);border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px}
.who .nm{font-weight:600} .who .em{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:2px;padding:3px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;width:max-content;max-width:100%;overflow:auto;margin-bottom:16px}
.tabs button{border:0;background:none;height:30px;padding:0 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-1),0 0 0 1px var(--line)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;padding:3px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line)}

/* forms */
.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--text2)}
.f .h{font-weight:400;color:var(--muted);font-size:12px}
.in{height:38px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-size:14px;font-weight:400;color:var(--text);transition:border-color .12s,box-shadow .12s}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.in:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.in::placeholder{color:var(--muted)}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){ .fgrid{grid-template-columns:minmax(0,1fr)} }
.chk{display:flex;align-items:center;gap:9px;font-weight:500;color:var(--text);font-size:13.5px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--brand)}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding:0}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search svg.i{position:absolute;left:11px;top:10px;color:var(--muted)}
.search .in{padding-left:34px}

/* banners */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--text2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.info{background:var(--info-soft);border-color:transparent;color:var(--info)}
.note.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.note.click{cursor:pointer}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 50%,var(--sk1) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite linear;border-radius:8px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.42);z-index:60;opacity:0;transition:opacity .18s}
.scrim.show{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:61;display:flex;flex-direction:column;box-shadow:var(--sh-3);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.drawer.show{transform:none}
.drawer.wide{width:min(760px,100%)}
.dh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.dh h3{margin:0;font-size:16px;font-weight:600;flex:1;min-width:0}
.db{flex:1;overflow:auto;padding:20px}
.df{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line2);background:var(--surface)}
@media (max-width:640px){
  .drawer,.drawer.wide{top:auto;left:0;width:100%;max-height:92vh;border-radius:18px 18px 0 0;transform:translateY(100%)}
  .drawer.show{transform:none}
  .df{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .drawer:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
}
.dialog{position:fixed;left:50%;top:18vh;transform:translate(-50%,8px) scale(.98);width:min(440px,calc(100% - 32px));background:var(--surface);border-radius:16px;box-shadow:var(--sh-3);z-index:62;opacity:0;transition:opacity .16s,transform .16s;border:1px solid var(--line)}
.dialog.show{opacity:1;transform:translate(-50%,0) scale(1)}
.dialog .db{padding:20px 20px 6px} .dialog .df{border:0;border-radius:0 0 16px 16px}
.x{width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.x:hover{background:var(--surface2);color:var(--text)}

/* command palette */
.cmdk{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-3);z-index:70;overflow:hidden}
.cmdk .q{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line2)}
.cmdk .q input{flex:1;height:54px;border:0;background:none;font-size:16px;outline:0}
.cmdk .res{max-height:min(60vh,420px);overflow:auto;padding:6px}
.cmdk .g{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 10px 4px}
.cmdk .o{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.cmdk .o.on{background:var(--brand-soft);color:var(--brand)}
.cmdk .o .k{margin-left:auto;font-size:12px;color:var(--muted)}
.pop{position:fixed;top:64px;right:24px;width:min(380px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-3);z-index:65;overflow:hidden;animation:fadein .14s ease}
.pop .ph{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2);font-weight:600}
.pop .pl{max-height:60vh;overflow:auto}

/* ------------------------------ API with stale-while-revalidate cache ------------------------------ */
const state = { token: store.get('mf_token'), user: null, company: { name: 'Mfilm' }, features: {}, view: 'home', params: {}, pending: 0, notes: [] };
const READS = new Set(['me', 'home', 'notifications', 'announcements', 'whoIsOut', 'myAttendance', 'leaveMeta', 'myPayslips', 'payslipData', 'approvals', 'team', 'dashboard', 'employees', 'locations', 'holidays', 'leaveTypes', 'allLeaves', 'attendance', 'adjustments', 'payroll', 'settings', 'audit', 'allAnnouncements', 'today', 'shifts', 'roster', 'myRoster']);
const CACHE = new Map();
const CACHE_MS = 5 * 60 * 1000;

function rawApi(action, data) {
  return new Promise((resolve, reject) => {
    const done = r => {
      if (r && r.ok) return resolve(r.data);
      if (r && r.auth && action !== 'login') logout(r.error);
      reject(new Error((r && r.error) || 'Something went wrong. Please try again.'));
    };
    const fail = e => reject(new Error((e && e.message) || 'Can’t reach the server. Check your internet connection.'));
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(s => { try { done(JSON.parse(s)); } catch (e) { fail(e); } }).withFailureHandler(fail).api(action, state.token, data || {});
    } else if (CONFIG.API_URL) {
      fetch(CONFIG.API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, token: state.token, data: data || {} }) })
        .then(r => r.json()).then(done).catch(() => fail());
    } else if (window.MockAPI) {
      setTimeout(() => { try { done(window.MockAPI(action, state.token, data || {})); } catch (e) { fail(e); } }, 160);
    } else reject(new Error('Server address not set. Edit CONFIG.API_URL in index.html.'));
  });
}
/** Writes: always hit the server, then clear cached reads. */
async function api(action, data) {
  const r = await rawApi(action, data);
  if (!READS.has(action)) CACHE.clear();
  return r;
}
/** Reads: serve from cache instantly when we have it; the router refreshes in the background. */
const RUN = { seq: 0, used: null };
function get(action, data) {
  const k = action + '|' + JSON.stringify(data || {});
  const c = CACHE.get(k);
  if (c && Date.now() - c.t < CACHE_MS) { if (RUN.used) RUN.used.push({ k: k, action: action, data: data }); return Promise.resolve(c.v); }
  return rawApi(action, data).then(v => { CACHE.set(k, { v: v, t: Date.now() }); return v; });
}
function prefetch(list) { list.forEach(([a, d]) => { const k = a + '|' + JSON.stringify(d || {}); if (!CACHE.has(k)) rawApi(a, d).then(v => CACHE.set(k, { v: v, t: Date.now() })).catch(() => { }); }); }

async function busy(btn, fn) {
  if (btn) { btn.classList.add('busy'); btn.disabled = true; }
  try { return await fn(); }
  catch (e) { toast(e.message, 'err'); }
  finally { if (btn) { btn.classList.remove('busy'); btn.disabled = false; } }
}
function download(filename, mime, text, base64) {
  let blob;
  if (base64) { const bin = atob(base64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); blob = new Blob([arr], { type: mime }); }
  else blob = new Blob([(mime === 'text/csv' ? '﻿' : '') + text], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

function field(f, v) {

  if (f.type === 'check') return '<label class="chk' + (f.full ? ' full' : '') + '"><input type="checkbox" name="' + f.k + '" id="' + id + '"' + (val === true || val === 'Y' ? ' checked' : '') + '> ' + esc(f.label) + '</label>';
  let input;

}

function readForm(el) { const o = {}; $$('input[name],select[name],textarea[name]', el).forEach(i => { o[i.name] = i.type === 'checkbox' ? (i.checked ? 'Y' : 'N') : i.value.trim(); }); return o; }

let OVERLAY = null;
function closeOverlay() {
  if (!OVERLAY) return;
  const o = OVERLAY; OVERLAY = null;
  o.panel.classList.remove('show'); o.scrim.classList.remove('show');
  document.removeEventListener('keydown', o.onKey);
  setTimeout(() => { o.panel.remove(); o.scrim.remove(); if (o.onClose) o.onClose(); }, 220);
}
function overlay(kind, title, body, opts) {
  closeOverlay(); closePop();
  opts = opts || {};
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const panel = document.createElement('div');
  panel.className = kind + (opts.wide ? ' wide' : '');
  panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-modal', 'true'); panel.setAttribute('aria-label', title);
  panel.innerHTML = (kind === 'drawer' ? '<div class="dh"><h3>' + esc(title) + '</h3>' + (opts.noClose ? '' : '<button class="x" data-close aria-label="Close">' + icon('x') + '</button>') + '</div>' : '') +
    '<div class="db">' + (kind === 'dialog' ? '<h3 style="margin:0 0 6px;font-size:16px">' + esc(title) + '</h3>' : '') + body + '</div>' +
    (opts.actions ? '<div class="df">' + opts.actions + '</div>' : '');
  $('#layer').append(scrim, panel);
  requestAnimationFrame(() => { scrim.classList.add('show'); panel.classList.add('show'); });
  const onKey = e => { if (e.key === 'Escape' && !opts.noClose) closeOverlay(); };
  document.addEventListener('keydown', onKey);
  if (!opts.noClose) scrim.onclick = closeOverlay;
  panel.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeOverlay(); });
  OVERLAY = { panel: panel, scrim: scrim, onKey: onKey, onClose: opts.onClose };
  setTimeout(() => { const f = $('input:not([type=hidden]),select,textarea', panel); if (f && kind === 'drawer' && window.innerWidth > 640) f.focus(); }, 240);
  return panel;
}
const drawer = (t, b, o) => overlay('drawer', t, b, o);
function confirmBox(title, text, okLabel, danger) {
  return new Promise(res => {
    let answered = false;
    const p = overlay('dialog', title, '<p class="t2" style="margin:0">' + esc(text) + '</p>', {
      actions: '<button class="btn" data-no>Cancel</button><button class="btn ' + (danger ? 'dark' : 'pri') + '" data-yes>' + esc(okLabel || 'Confirm') + '</button>',
      onClose: () => { if (!answered) res(false); }

    $('[data-no]', p).onclick = () => { answered = true; closeOverlay(); res(false); };
    $('[data-yes]', p).onclick = () => { answered = true; closeOverlay(); res(true); };
  });
}

function strengthOf(p) { let s = 0; if (p.length >= 8) s++; if (p.length >= 12) s++; if (/[A-Z]/.test(p) && /[a-z]/.test(p)) s++; if (/\d/.test(p)) s++; if (/[^A-Za-z0-9]/.test(p)) s++; return Math.min(4, s); }
function changePassword(forced, current) {

const geo = { watch: null, fix: null, timer: null };
function startGeo(onFix, onErr) {
  stopGeo();
  if (!navigator.geolocation) { onErr && onErr('This device can’t share its location.'); return; }
  geo.watch = navigator.geolocation.watchPosition(p => {
    const f = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
    if (!geo.fix || f.acc <= geo.fix.acc || Date.now() - geo.fix.t > 15000) geo.fix = f;
    onFix && onFix(geo.fix);
  }, err => onErr && onErr(err.code === 1 ? 'Location is blocked. Allow location for this site in your browser settings.' : 'Couldn’t get your location. Turn on GPS or precise location.'),
  { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
  geo.timer = setTimeout(stopGeo, 120000);
}
function stopGeo() { if (geo.watch !== null && navigator.geolocation) navigator.geolocation.clearWatch(geo.watch); geo.watch = null; clearTimeout(geo.timer); }
function getFix() {
  return new Promise(resolve => {
    if (geo.fix && Date.now() - geo.fix.t < 60000) return resolve(geo.fix);
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }), () => resolve(null), { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  });
}
/** Opens the front camera (or photo picker) and returns a compressed JPEG data URL. */
function takeSelfie() {
  return new Promise((resolve, reject) => {
    const inp = $('#cam'); inp.value = '';
    inp.onchange = () => {
      const file = inp.files && inp.files[0]; if (!file) return reject(new Error('No photo taken.'));
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, 480 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => reject(new Error('Couldn’t read the photo.'));
      img.src = url;
    };
    inp.click();
  });
}

/** Bar chart (SVG) — bars scaled to max, labels every n. */
function barChart(points, opts) {
  opts = opts || {};
  const W = 640, H = 180, pl = 28, pb = 22, pt = 10;
  const max = Math.max(opts.max || 0, ...points.map(p => p.v), 1);
  const bw = (W - pl) / points.length;
  const ticks = [0, Math.round(max / 2), max];
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.label || 'Chart') + '">';
  ticks.forEach(t => { const y = H - pb - (t / max) * (H - pb - pt); s += '<line x1="' + pl + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--line2)"/><text x="' + (pl - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + t + '</text>'; });
  if (opts.max) { const y = H - pb - (opts.max / max) * (H - pb - pt); s += '<line x1="' + pl + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--muted)" stroke-dasharray="3 4"/>'; }
  points.forEach((p, i) => {
    const h = (p.v / max) * (H - pb - pt); const x = pl + i * bw + bw * 0.18; const w = bw * 0.64;

    if (p.l) s += '<text x="' + (x + w / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(p.l) + '</text>';

}

/* ---------- Duty roster ---------- */
const RS = { edits: new Map(), brush: null, painting: false, data: null, range: null, ent: {}, seen: false };
const SWATCHES = ['#2563eb', '#16a34a', '#ea580c', '#7c3aed', '#dc2626', '#0891b2', '#ca8a04', '#db2777', '#4f46e5', '#059669', '#64748b', '#94a3b8'];
const shiftOf = (shifts, code) => (shifts || []).find(s => String(s.Code).toUpperCase() === String(code || '').toUpperCase());
const isOffShift = s => !!s && String(s.Kind).toUpperCase() === 'OFF';
const shiftLabel = s => s ? (isOffShift(s) ? s.Name : s.Name + ' · ' + s.Start + '–' + s.End) : '';
const mondayOf = iso => addDays(iso, -((dowOf(iso) + 6) % 7));
const daysBetween = (a, b) => Math.round((Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8)) - Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8))) / 864e5);
function dutyChip(d, extra) {
  if (!d) return '';
  const def = d.source === 'default';
  const label = d.kind === 'OFF' ? d.name : (def ? 'Regular shift' : d.name) + ' · ' + d.start + '–' + d.end;
  return '<span class="dchip" style="--c:' + esc(def ? '#94a3b8' : (d.color || '#64748b')) + '"><i></i>' + esc(label + (extra || '')) + '</span>';
}
function rosterRange(p) {
  const span = p.span || store.get('mf_rspan') || 'week';
  const base = p.from || todayISO();
  if (span === 'month') { const m = base.slice(0, 7); const last = new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate(); return { span: span, from: m + '-01', to: m + '-' + pad(last) }; }
  const from = mondayOf(base);
  return { span: span, from: from, to: addDays(from, span === '2w' ? 13 : 6) };
}
/** Unsaved edit for a cell, compared against what is stored, so painting the same shift twice is a no-op. */
function rosterSetEdit(k, obj) {
  const en = RS.ent[k];
  const cur = en ? { ShiftCode: en.ShiftCode || '', Start: en.Start || '', End: en.End || '', LocID: en.LocID || '', Note: en.Note || '' } : { ShiftCode: '', Start: '', End: '', LocID: '', Note: '' };
  const same = cur.ShiftCode === obj.ShiftCode && (!obj.ShiftCode || (cur.Start === obj.Start && cur.End === obj.End && cur.LocID === obj.LocID && cur.Note === obj.Note));
  if (same) RS.edits.delete(k); else RS.edits.set(k, obj);
}
function rosterEditFor(e, dt, code, extra) {
  if (code === '__clear' || !code) return { EmpID: e.EmpID, Date: dt, ShiftCode: '', Start: '', End: '', LocID: '', Note: '' };
  const s = shiftOf(RS.data.shifts, code);
  const off = isOffShift(s);
  return Object.assign({ EmpID: e.EmpID, Date: dt, ShiftCode: s.Code, Start: off ? '' : s.Start, End: off ? '' : s.End, LocID: s.LocID || '', Note: '' }, extra || {});
}

  const dates = []; for (let x = d.from; x <= d.to; x = addDays(x, 1)) dates.push(x);

  const hol = {}; d.holidays.forEach(h => hol[h.Date] = h.Name);

      dates.map(dt => '<td data-k="' + e.EmpID + '|' + dt + '">' + cellHTML(e, dt) + '</td>').join('') + '</tr>';
  });

  el.innerHTML = head('Duty roster', (R.span === 'month' ? monthName(d.from.slice(0, 7)) : fmtD(d.from) + ' – ' + fmtD(d.to)) + (drafts ? ' · <b style="color:var(--warn)">' + drafts + ' draft day' + (drafts > 1 ? 's' : '') + ' not published</b>' : ''),

    '<button class="btn" id="rexp">' + icon('download') + 'Export</button>' + (d.canEdit ? '<button class="btn pri" id="rpub">' + icon('send') + 'Publish</button>' : '')) +
    '<div class="toolbar">' + spanSeg + '<div class="row" style="gap:6px"><button class="btn sm" id="rprev" aria-label="Previous">' + icon('left') + '</button><button class="btn sm" id="rtoday">Today</button><button class="btn sm" id="rnext" aria-label="Next">' + icon('right') + '</button></div>' +
    '<select class="in" id="rdept" style="width:auto;height:32px"><option value="">All departments</option>' + depts.map(x => '<option' + (p.dept === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select>' +
    '<div class="search" style="max-width:260px">' + icon('search') + '<input class="in" id="rq" placeholder="Find a person" style="height:32px" value="' + esc(p.q || '') + '"></div></div>' + pal +
    (d.employees.length ? '<div class="rgrid" id="rgrid"><table><thead><tr>' + head1 + '</tr></thead><tbody>' + body + '</tbody></table></div>' : '<div class="card">' + empty('users', myRank() >= 3 ? 'No active employees yet.' : 'No one reports to you yet. HR sets this in each person’s “Reports to” field.') + '</div>') +
    '<div class="rlegend"><span><i style="border-style:dashed"></i>Draft: staff don’t see it until you publish</span><span><i style="border:0;background:var(--brand);width:8px;height:8px;border-radius:50%"></i>Not saved yet</span><span><i style="background:var(--info);border:0"></i>Leave</span><span><b style="color:var(--text2)">09:30 regular</b> / <b style="color:var(--text2)">WO</b> = not rostered, the person’s usual shift or weekly off applies</span></div>' +
    '<div class="savebar' + (RS.edits.size ? '' : ' hidden') + '" id="rbar"><span class="grow" id="rbart"></span><button class="btn sm" id="rdis" style="background:transparent;color:inherit;border-color:rgba(255,255,255,.3)">Discard</button><button class="btn sm" id="rsave" style="background:transparent;color:inherit;border-color:rgba(255,255,255,.3)">Save draft</button><button class="btn sm pri" id="rsavepub">Save &amp; publish</button></div>';

      if (RS.brush !== null && nm) { const e = empBy[nm.dataset.row]; dates.forEach(dt => paint(e, dt)); bar(); return; }
      if (!td) return;

    grid.addEventListener('click', ev => { if (lastType !== 'mouse') act(ev); });
    grid.addEventListener('pointerover', ev => {
      if (!RS.painting || RS.brush === null) return;

      const k = e.EmpID + '|' + dt;

      const w = ed || en || {};
      const lv = leaveFor(e.EmpID, dt);

      const can = editable(e);
      const info = (hol[dt] ? '<div class="note warn" style="margin-bottom:10px">' + icon('star') + '<span>Holiday: ' + esc(hol[dt]) + '</span></div>' : '') +
        (lv ? '<div class="note info" style="margin-bottom:10px">' + icon('leave') + '<span>' + esc(lv.Code) + ' leave ' + (lv.Status === 'Pending' ? 'requested (pending)' : 'approved') + ' for this day. Leave wins over the roster.</span></div>' : '') +
        (en && en.Status === 'Draft' ? '<div class="note" style="margin-bottom:10px">' + icon('send') + '<span>Staff currently see: <b>' + esc(pub ? (isOffShift(pub) ? pub.Name : pub.Name + ' · ' + en.PubStart + '–' + en.PubEnd) : 'their regular shift') + '</b>. Publish to update them.</span></div>' : '');
      const locOpts = [['', '— Usual check-in places —']].concat(d.locations.filter(l => (!l.ValidFrom || l.ValidFrom <= dt) && (!l.ValidTo || l.ValidTo >= dt)).map(l => [l.LocID, l.Name]));
      const pnl = drawer(e.Name + ' · ' + DOW[dowOf(dt)] + ' ' + fmtD(dt), info +
        (can ? formHTML([
          { k: 'ShiftCode', label: 'Duty', type: 'select', full: true, options: [['', '— Not rostered: ' + (e.offDates.indexOf(dt) >= 0 ? 'weekly off' : 'regular shift ' + e.ShiftStart + '–' + e.ShiftEnd) + ' —']].concat(d.shifts.filter(s => s.Active !== 'N' || s.Code === w.ShiftCode).map(s => [s.Code, s.Code + ' · ' + shiftLabel(s)])) },
          { k: 'Start', label: 'Starts', type: 'time' }, { k: 'End', label: 'Ends', type: 'time', hint: 'Earlier than the start = ends next day' },
          { k: 'LocID', label: 'Check in at', type: 'select', options: locOpts, full: true, hint: 'Pick a place to allow check-in only there that day' },
          { k: 'Note', label: 'Note for the person', full: true, ph: 'e.g. Call time 6:30 at gate 2' },
          { k: 'apply', label: 'Apply to', type: 'select', full: true, options: [['day', 'This day only'], ['row', 'Every day shown for ' + e.Name.split(' ')[0]], ['col', 'Everyone shown on ' + fmtDS(dt)]] }
        ], { ShiftCode: w.ShiftCode || '', Start: w.Start || '', End: w.End || '', LocID: w.LocID || '', Note: w.Note || '' }) : '<p class="t2">' + (w.ShiftCode ? esc(shiftLabel(shiftOf(d.shifts, w.ShiftCode)) || w.ShiftCode) : 'Not rostered') + '</p><p class="muted sm">You can view this person’s roster but not change it.</p>'),
        { actions: can ? '<button class="btn" data-close>Cancel</button><button class="btn pri" id="ceok">Apply</button>' : '<button class="btn" data-close>Close</button>' });
      if (!can) return;
      const sel = $('[name=ShiftCode]', pnl), st = $('[name=Start]', pnl), en2 = $('[name=End]', pnl), lc = $('[name=LocID]', pnl);
      const sync = fill => {
        const s = shiftOf(d.shifts, sel.value);
        const work = s && !isOffShift(s);
        [st, en2].forEach(i => i.closest('label').classList.toggle('hidden', !work));
        lc.closest('label').classList.toggle('hidden', !s); $('[name=Note]', pnl).closest('label').classList.toggle('hidden', !s);
        if (fill && s) { st.value = s.Start || ''; en2.value = s.End || ''; lc.value = s.LocID || ''; }
      };
      sel.onchange = () => sync(true); sync(!w.ShiftCode);
      $('#ceok', pnl).onclick = () => {
        const f = readForm(pnl);
        const s = shiftOf(d.shifts, f.ShiftCode);
        if (s && !isOffShift(s) && (!f.Start || !f.End)) return toast('Enter start and end times.', 'err');
        const targets = f.apply === 'row' ? dates.map(x => [e, x]) : f.apply === 'col' ? visibleRows().map(x => [x, dt]) : [[e, dt]];
        const list = [];
        targets.forEach(([pe, pdt]) => {
          if (!editable(pe) || (pe.DOJ && pdt < pe.DOJ) || (pe.ExitDate && pdt > pe.ExitDate)) return;
          list.push(s ? { EmpID: pe.EmpID, Date: pdt, ShiftCode: s.Code, Start: isOffShift(s) ? '' : f.Start, End: isOffShift(s) ? '' : f.End, LocID: f.LocID || '', Note: f.Note || '' } : rosterEditFor(pe, pdt, '__clear'));
        });
        RS.applyEdits(list);
        closeOverlay();
      };
    }

    const saveAll = async (publish, btn) => busy(btn, async () => {
      const entries = [...RS.edits.values()];
      if (!entries.length && !publish) return;
      if (entries.length) await api('saveRoster', { entries: entries, publish: false });
      RS.edits.clear();
      if (publish) {
        const r = await api('publishRoster', { from: d.from, to: d.to });
        toast(r.published ? 'Published ' + r.published + ' day' + (r.published > 1 ? 's' : '') + ' for ' + r.people + ' ' + (r.people > 1 ? 'people' : 'person') + (r.emailed ? ' · ' + r.emailed + ' emailed' : '') + '.' : 'Saved. Nothing new to publish in this view.', 'ok');
      } else toast('Draft saved. Staff won’t see it until you publish.', 'ok');
      go('roster', p, { keepScroll: true });

    $('#rdis', root).onclick = () => { RS.edits.clear(); go('roster', p, { keepScroll: true }); };
    $('#rsave', root).onclick = e => saveAll(false, e.currentTarget);
    $('#rsavepub', root).onclick = async e => { const btn = e.currentTarget; if (await confirmBox('Save and publish?', 'Changes are saved, and every draft from ' + fmtDS(d.from) + ' to ' + fmtDS(d.to) + ' goes live. Each person gets an email with their duties.', 'Save & publish')) saveAll(true, btn); };
    const pub = $('#rpub', root);
    if (pub) pub.onclick = async e => {
      const btn = e.currentTarget;

      if (await confirmBox('Publish the roster?', (RS.edits.size ? 'Your unsaved changes are saved first. ' : '') + 'Every draft from ' + fmtDS(d.from) + ' to ' + fmtDS(d.to) + ' goes live for attendance, and each person gets an email with their duties.', 'Publish')) saveAll(true, btn);
    };
    const pat = $('#rpat', root); if (pat) pat.onclick = () => patternDrawer(visibleRows().filter(editable), d.from, d.to);

  });
};

function patternDrawer(people, from, to) {
  const shifts = RS.data.shifts.filter(s => s.Active !== 'N');
  const opt = (v) => '<option value="__keep">(leave as is)</option><option value="__clear"' + (v === '__clear' ? ' selected' : '') + '>Not rostered</option>' + shifts.map(s => '<option value="' + esc(s.Code) + '"' + (v === s.Code ? ' selected' : '') + '>' + esc(s.Code + ' · ' + shiftLabel(s)) + '</option>').join('');
  const off = shifts.find(isOffShift), work = shifts.find(s => !isOffShift(s));
  const wk = [1, 2, 3, 4, 5, 6, 0];
  let seq = work ? [work.Code, work.Code, work.Code, work.Code, work.Code].concat(off ? [off.Code, off.Code] : []) : [];
  const p = drawer('Fill a pattern', '<div class="seg" id="pmode" style="margin-bottom:16px"><button data-m="wk" class="on">By weekday</button><button data-m="cy">Repeating cycle</button></div>' +
    '<div id="pwk"><p class="muted sm" style="margin-top:0">Choose a duty for each weekday. It repeats every week in the dates below.</p><div class="fgrid">' + wk.map(w => '<label class="f">' + DOW[w] + 'day<select class="in" data-dow="' + w + '">' + opt(w === 0 ? (off ? off.Code : '__keep') : w === 6 ? '__keep' : (work ? work.Code : '__keep')) + '</select></label>').join('') + '</div></div>' +
    '<div id="pcy" class="hidden"><p class="muted sm" style="margin-top:0">Build a sequence that repeats, e.g. M M E E N N OFF OFF for a rotating crew. Click a shift to add it; click an item to remove it.</p>' +
    '<div class="rpal">' + shifts.map(s => '<button class="chip" data-add="' + esc(s.Code) + '" style="--c:' + esc(s.Color) + '"><span class="sw"></span>' + esc(s.Code) + '</button>').join('') + '<button class="chip" data-addc="1">' + icon('trash') + 'Clear sequence</button></div>' +
    '<div class="seqbox" id="pseq"></div><label class="chk" style="margin-top:12px"><input type="checkbox" id="pstag"> Stagger: each person starts one step later (spreads offs across the team)</label></div>' +
    '<h2 class="sec">Dates</h2><div class="fgrid">' + field({ k: 'from', label: 'From', type: 'date', req: true, def: from }) + field({ k: 'to', label: 'To', type: 'date', req: true, def: to }) + '</div>' +
    '<h2 class="sec">People</h2><label class="chk" style="margin-bottom:8px"><input type="checkbox" id="pall" checked> <b>Everyone shown (' + people.length + ')</b></label><div class="list" style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 12px">' +
    people.map(e => '<label class="it chk" style="padding:8px 0"><input type="checkbox" data-pp="' + e.EmpID + '" checked> ' + esc(e.Name) + ' <span class="muted sm">' + esc(e.Department || '') + '</span></label>').join('') + '</div>' +
    '<h2 class="sec">Options</h2><label class="chk"><input type="checkbox" id="phol" checked> Don’t change holidays</label><label class="chk" style="margin-top:8px"><input type="checkbox" id="pfill"> Only fill days that are not rostered yet</label>',
    { wide: true, actions: '<button class="btn" data-close>Cancel</button><button class="btn pri" id="pgo">' + icon('sparkle') + 'Fill</button>' });
  let mode = 'wk';
  const drawSeq = () => { $('#pseq', p).innerHTML = seq.length ? seq.map((c, i) => { const s = shiftOf(shifts, c) || {}; return '<button class="chip" data-rm="' + i + '" style="--c:' + esc(s.Color || '#64748b') + '" title="Remove"><span class="sw"></span>' + esc(c) + '</button>'; }).join('') : '<span class="muted sm" style="padding:6px">Empty. Click shifts above to add steps.</span>'; $$('[data-rm]', p).forEach(b => b.onclick = () => { seq.splice(+b.dataset.rm, 1); drawSeq(); }); };
  drawSeq();
  $$('[data-add]', p).forEach(b => b.onclick = () => { if (seq.length < 42) { seq.push(b.dataset.add); drawSeq(); } });
  $('[data-addc]', p).onclick = () => { seq = []; drawSeq(); };
  $$('#pmode button', p).forEach(b => b.onclick = () => { mode = b.dataset.m; $$('#pmode button', p).forEach(x => x.classList.toggle('on', x === b)); $('#pwk', p).classList.toggle('hidden', mode !== 'wk'); $('#pcy', p).classList.toggle('hidden', mode !== 'cy'); });
  $('#pall', p).onchange = e => $$('[data-pp]', p).forEach(c => c.checked = e.target.checked);
  $('#pgo', p).onclick = () => {
    const f = readForm(p);
    if (!f.from || !f.to || f.to < f.from) return toast('Choose a valid date range.', 'err');
    if (daysBetween(f.from, f.to) > 61) return toast('Fill up to 62 days at a time.', 'err');
    if (mode === 'cy' && !seq.length) return toast('Add at least one step to the cycle.', 'err');
    const ids = $$('[data-pp]', p).filter(c => c.checked).map(c => c.dataset.pp);
    if (!ids.length) return toast('Choose at least one person.', 'err');
    const byDow = {}; $$('[data-dow]', p).forEach(s => byDow[s.dataset.dow] = s.value);
    const hol = {}; RS.data.holidays.forEach(h => hol[h.Date] = 1);
    const skipHol = $('#phol', p).checked, onlyEmpty = $('#pfill', p).checked, stag = $('#pstag', p).checked;
    const list = [];
    ids.forEach((id, i) => {
      const e = people.find(x => x.EmpID === id);
      for (let dt = f.from, n = 0; dt <= f.to; dt = addDays(dt, 1), n++) {
        if ((e.DOJ && dt < e.DOJ) || (e.ExitDate && dt > e.ExitDate)) continue;
        if (skipHol && hol[dt]) continue;
        const k = id + '|' + dt, cur = RS.edits.get(k) || RS.ent[k];
        if (onlyEmpty && cur && cur.ShiftCode) continue;
        const code = mode === 'wk' ? byDow[dowOf(dt)] : seq[(n + (stag ? i : 0)) % seq.length];
        if (code === '__keep') continue;
        list.push(rosterEditFor(e, dt, code));
      }
    });
    closeOverlay();
    RS.applyEdits(list);
    toast(list.length + ' day' + (list.length === 1 ? '' : 's') + ' filled. Review, then Save draft or Save & publish.', 'ok');
  };
}

function copyDrawer(people, from, to, R) {
  const len = daysBetween(from, to) + 1;
  const srcDef = R.span === 'month' ? shiftMonth(from.slice(0, 7), -1) + '-01' : addDays(from, -len);
  const p = drawer('Copy duties', '<p class="muted" style="margin-top:0">Copies each person’s duties from an earlier period onto ' + (R.span === 'month' ? monthName(from.slice(0, 7)) : fmtDS(from) + ' – ' + fmtDS(to)) + ', day by day.</p>' +
    formHTML([{ k: 'src', label: 'Copy from the period starting', type: 'date', req: true, def: srcDef, full: true, hint: R.span === 'month' ? 'Day 1 of the source maps to day 1 of this month' : 'Usually the same weekday as ' + fmtDS(from) }]) +
    '<label class="chk" style="margin-top:14px"><input type="checkbox" id="cover"> Overwrite days already rostered here</label>' +
    '<p class="muted sm">For ' + people.length + ' ' + (people.length === 1 ? 'person' : 'people') + ' shown. Nothing is saved until you click Save.</p>',
    { actions: '<button class="btn" data-close>Cancel</button><button class="btn pri" id="cgo">' + icon('refresh') + 'Copy</button>' });
  $('#cgo', p).onclick = e => busy(e.currentTarget, async () => {
    const src = readForm(p).src;
    if (!src) throw new Error('Choose a start date.');
    const srcTo = addDays(src, len - 1);
    const s = await get('roster', { from: src, to: srcTo });
    const over = $('#cover', p).checked;
    const ids = new Set(people.map(x => x.EmpID));
    const list = [];
    s.entries.forEach(x => {
      if (!ids.has(x.EmpID) || !x.ShiftCode) return;
      const dt = addDays(from, daysBetween(src, x.Date));
      if (dt > to) return;
      const pe = people.find(y => y.EmpID === x.EmpID);
      if ((pe.DOJ && dt < pe.DOJ) || (pe.ExitDate && dt > pe.ExitDate)) return;
      const cur = RS.edits.get(x.EmpID + '|' + dt) || RS.ent[x.EmpID + '|' + dt];
      if (!over && cur && cur.ShiftCode) return;
      list.push({ EmpID: x.EmpID, Date: dt, ShiftCode: x.ShiftCode, Start: x.Start || '', End: x.End || '', LocID: x.LocID || '', Note: x.Note || '' });
    });
    closeOverlay();
    RS.applyEdits(list);
    toast(list.length ? 'Copied ' + list.length + ' day' + (list.length === 1 ? '' : 's') + '. Review, then save.' : 'Nothing to copy from that period.', list.length ? 'ok' : '');
  });
}

async function shiftsDrawer() {
  const list = await get('shifts');

}
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
function importDrawer() {
  const cols = ['Name', 'Email', 'Phone', 'Department', 'Designation', 'Role', 'DOJ', 'Gender', 'DOB', 'ShiftStart', 'ShiftEnd', 'WeeklyOff', 'Basic', 'HRA', 'Conveyance', 'Special', 'OtherAllowance', 'PAN', 'UAN', 'ESINo', 'BankName', 'BankAccount', 'IFSC', 'WorkState'];

    '<div class="row" style="margin-bottom:16px"><label class="btn pri">' + icon('upload') + 'Choose CSV file<input type="file" accept=".csv,text/csv" id="csvf" class="hidden"></label><button class="btn" id="tmpl">' + icon('download') + 'Download template</button></div><div id="prev"></div>',
    { wide: true, actions: '<button class="btn" data-close>Cancel</button><label class="chk" style="margin-right:auto"><input type="checkbox" id="impw" checked> Email sign-in details</label><button class="btn pri" id="impgo" disabled>Import</button>' });
  let rows = [];
  $('#tmpl', p).onclick = () => download('employee_import_template.csv', 'text/csv', cols.join(',') + '\nRavi Kumar,ravi@example.com,9800000000,Camera,Focus Puller,Employee,2026-11-01,Male,1995-05-20,09:30,18:30,Sun,15000,6000,1600,4000,0,ABCDE1234F,,,HDFC Bank,50100012345678,HDFC0001234,MH');
  $('#csvf', p).onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      const data = parseCSV(String(rd.result).replace(/^﻿/, ''));
      if (data.length < 2) return toast('That file has no data rows.', 'err');
      const hdr = data[0].map(h => h.trim());
      const find = c => hdr.findIndex(h => h.toLowerCase().replace(/[^a-z]/g, '') === c.toLowerCase());
      rows = data.slice(1).map(r => { const o = {}; cols.forEach(c => { const i = find(c); if (i >= 0) o[c] = (r[i] || '').trim(); }); return o; });

      $('#impgo', p).disabled = !(find('Name') >= 0 && find('Email') >= 0);
      if ($('#impgo', p).disabled) toast('The file needs Name and Email columns.', 'err');
    };
    rd.readAsText(file);
  };
  $('#impgo', p).onclick = e => busy(e.currentTarget, async () => {
    const r = await api('importEmployees', { rows: rows, sendWelcome: $('#impw', p).checked });
    if (r.errors.length && !r.imported) { $('#prev', p).insertAdjacentHTML('afterbegin', '<div class="note warn" style="margin-bottom:14px;display:block"><b>Nothing imported. Fix these rows and try again:</b><br>' + r.errors.map(esc).join('<br>') + '</div>'); return; }

    setTimeout(() => overlay('drawer', 'Temporary passwords', '<p class="muted" style="margin-top:0">Keep this list safe. Each person changes their password at first sign-in.</p><div class="tbl"><table class="t"><thead><tr><th>Name</th><th>ID</th><th>Email</th><th>Password</th></tr></thead><tbody>' + r.credentials.map(c => '<tr><td>' + esc(c.Name) + '</td><td>' + esc(c.EmpID) + '</td><td>' + esc(c.Email) + '</td><td style="font-family:var(--mono)">' + esc(c.tempPassword) + '</td></tr>').join('') + '</tbody></table></div>', { wide: true, actions: '<button class="btn pri" data-close>Done</button>' }), 300);

VIEWS.settings = async (el, p) => {
  const tab = p.tab || 'settings';
  const tabs = '<div class="tabs"><button data-tab="settings" class="' + (tab === 'settings' ? 'on' : '') + '">Settings</button><button data-tab="audit" class="' + (tab === 'audit' ? 'on' : '') + '">Audit log</button></div>';
  if (tab === 'audit') {
    const log = await get('audit');
    el.innerHTML = head('Settings', 'Every change made by HR is recorded here.') + tabs + '<div class="tbl"><table class="t"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead><tbody>' +
      (log.length ? log.map(a => '<tr><td class="muted">' + esc(a.Timestamp) + '</td><td>' + esc(a.User) + '</td><td><b>' + esc(a.Action) + '</b></td><td style="white-space:normal" class="t2">' + esc(a.Details) + '</td></tr>').join('') : '<tr><td colspan="4">' + empty('file', 'Nothing yet.') + '</td></tr>') + '</tbody></table></div>';
  } else {
    const rows = await get('settings');
    const groups = [['Company', /^(COMPANY|APP_URL|EMP_ID|TIMEZONE)/], ['Attendance', /^(DEFAULT_SHIFT|DEFAULT_WEEKLY|LATE|HALF_DAY|MISSED|UNMARKED|MAX_|OT_|LEAVE_|SELFIE)/], ['Duty roster', /^(ROSTER)/], ['Security', /^(SESSION)/], ['PF & ESI', /^(PF_|EPS|EDLI|ESI|WAGE_50)/], ['Income tax & professional tax', /^(TAX|PT_|DEFAULT_WORK)/], ['Other', /.*/]];
    const used = new Set(); let html = '';
    groups.forEach(g => {
      const items = rows.filter(r => !used.has(r.Key) && g[1].test(r.Key) && !/FOLDER_ID$/.test(r.Key)); items.forEach(r => used.add(r.Key));
      if (!items.length) return;
      html += '<div class="card" style="margin-bottom:14px"><div class="card-h"><h2>' + g[0] + '</h2></div><div class="card-b"><div class="fgrid">' + items.map(r => {
        const big = r.Key === 'PT_SLABS' || r.Key === 'TAX_SLABS';
        let v = r.Value; if (big) { try { v = JSON.stringify(JSON.parse(v), null, 1); } catch (e) { } }
        const label = r.Key.replace(/_/g, ' ').toLowerCase().replace(/^./, c => c.toUpperCase());
        const yn = /^(Y|N)$/.test(String(v)) && !big;
        return '<label class="f' + (big ? ' full' : '') + '">' + esc(label) + (big ? '<textarea class="in" data-key="' + r.Key + '" style="min-height:180px;font:12px var(--mono)">' + esc(v) + '</textarea>' : yn ? '<select class="in" data-key="' + r.Key + '"><option value="Y"' + (v === 'Y' ? ' selected' : '') + '>Yes</option><option value="N"' + (v === 'N' ? ' selected' : '') + '>No</option></select>' : '<input class="in" data-key="' + r.Key + '" value="' + esc(v) + '">') + (r.Note ? '<span class="h">' + esc(r.Note) + '</span>' : '') + '</label>';
      }).join('') + '</div></div></div>';
    });
    el.innerHTML = head('Settings', 'Statutory rates are set for FY 2026-27. Check them with your CA when rules change.') + tabs + html + '<div class="savebar hidden" id="sbar"><span class="grow">You have unsaved changes</span><button class="btn sm" id="sdis" style="background:transparent;color:inherit;border-color:rgba(255,255,255,.3)">Discard</button><button class="btn sm pri" id="ssv">Save changes</button></div>';
  }
  after(el, root => {
    $$('[data-tab]', root).forEach(b => b.onclick = () => go('settings', { tab: b.dataset.tab }));
    if (tab !== 'settings') return;
    const orig = {}; $$('[data-key]', root).forEach(i => orig[i.dataset.key] = i.value);
    const dirty = () => $$('[data-key]', root).filter(i => i.value !== orig[i.dataset.key]);
    $$('[data-key]', root).forEach(i => i.addEventListener('input', () => $('#sbar', root).classList.toggle('hidden', !dirty().length)));
    $$('[data-key]', root).forEach(i => i.addEventListener('change', () => $('#sbar', root).classList.toggle('hidden', !dirty().length)));
    $('#sdis', root).onclick = () => go('settings', {}, { keepScroll: true });
    $('#ssv', root).onclick = e => busy(e.currentTarget, async () => {
      const items = dirty().map(i => ({ Key: i.dataset.key, Value: i.tagName === 'TEXTAREA' ? (() => { try { return JSON.stringify(JSON.parse(i.value)); } catch (er) { return i.value; } })() : i.value.trim() }));
      await api('saveSettings', { items: items });
      PT_STATES = null;
      if (items.some(x => x.Key === 'SELFIE_ON_CHECKIN')) { try { state.features = (await rawApi('me')).features || {}; } catch (er) { } }
      toast('Settings saved.', 'ok'); go('settings', {}, { keepScroll: true });
    });
  });
};
